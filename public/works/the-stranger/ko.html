        <div class="work-body">
          <p itemprop="description">
            화면 중앙의 인물은 군중에 둘러싸여 있으며, 주변의 개별 인물들은
            거친 표면 속에서 하나의 익명화된 체계로 결합되어 나타난다. 사회가
            질서라는 이름으로, 그 논리에 소속되지 않는 자들을 어떻게
            비정상으로 명명하고 배제해 자신을 유지하는지에 대해 질문한다.
          </p>
