    <main>
      <h1 class="kicker page-title">Works</h1>

      <ul class="gallery" itemscope itemtype="https://schema.org/ItemList">

          itemtype="https://schema.org/ExhibitionEvent"

            <h2 itemprop="name">ORIGIN SEOUL 2026</h2>
            <p>
              <time itemprop="startDate" datetime="2026-08-31">Aug 31</time> –
              <time itemprop="endDate" datetime="2026-09-02">Sep 2, 2026</time>
              · Seoul
            </p>
          </a>
        </li>

        <li
          data-tags="ceramic"
          data-search="the stranger triptych 이방인 삼면화 2025 ceramic 세라믹"
          itemprop="itemListElement"
          itemscope
          itemtype="https://schema.org/ListItem"
        >
          <meta itemprop="position" content="1" />
          <a
            href="/works/the-stranger/"
            itemprop="item"
            itemscope
            itemtype="https://schema.org/VisualArtwork"
          >
            <link itemprop="url" href="/works/the-stranger/" />
            <figure>
              <img
                itemprop="image"
                src="/img/the-stranger/480.webp"
                srcset="
                  /img/the-stranger/480.webp 480w,
                  /img/the-stranger/640.webp 640w,
                  /img/the-stranger/960.webp 960w
                "
                sizes="(min-width: 1120px) 332px, (min-width: 760px) calc((100vw - 84px) / 3), calc(50vw - 26px)"
                width="480"
                height="330"
                alt="Ceramic relief triptych: a lone figure with hands bound behind its back, facing away, surrounded by a wall of small anonymous faces."
                decoding="async"
              />
              <figcaption>
                <span itemprop="name">The Stranger</span>
                <time itemprop="dateCreated" datetime="2025">2025</time>
              </figcaption>
            </figure>
          </a>
        </li>
