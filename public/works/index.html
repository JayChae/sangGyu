          itemscope
          itemtype="https://schema.org/VisualArtwork"
        >
          <a href="/works/the-stranger/" itemprop="url">
            <figure>
              <img
                itemprop="image"
                src="/img/the-stranger/480.webp"

                  /img/the-stranger/480.webp 480w,
                  /img/the-stranger/960.webp 960w

                sizes="(min-width: 760px) 340px, 46vw"
                width="480"
                height="330"
                alt="Ceramic relief triptych: a lone figure with hands bound behind its back, facing away, surrounded by a wall of small anonymous faces."

                decoding="async"
