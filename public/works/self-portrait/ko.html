    <style>
      /* 자소상 — 흉상: 얼굴을 먼저, 머리 크기만큼. 측면과 뒤는 그 아래 작은
         도판으로. */
      .work-hero { max-width: 560px; }
      .work-view { max-width: 440px; margin-top: 44px; }
    </style>

  <body class="detail">
    <header class="site-header">
      <a class="wordmark" href="/ko">PARK SANG GYU</a>
      <a class="lang" lang="en" hreflang="en" href="/works/self-portrait/">EN</a>
    </header>

    <main>
      <a class="back" href="/works/ko">← 작품</a>
      <article itemscope itemtype="https://schema.org/VisualArtwork">
        <figure class="work-hero">
          <img
            itemprop="image"
            src="/img/self-portrait/960.webp"
            srcset="
              /img/self-portrait/480.webp   480w,
              /img/self-portrait/960.webp   960w,
              /img/self-portrait/1200.webp 1200w,
              /img/self-portrait/1600.webp 1600w
            "
            sizes="(min-width: 600px) 560px, calc(100vw - 40px)"
            width="960"
            height="1282"
            alt="눈을 감은 흰 석고 흉상. 굽은 동물 뿔 두 개가 솟아 있고 양쪽 어깨에 작은 흰 천사상이 앉아 있다."
            fetchpriority="high"
            decoding="async"
          />
        </figure>

        <header class="work-head">
          <h1 itemprop="name">자소상 <em lang="en">Self-Portrait</em></h1>
          <p class="tombstone">
            <time itemprop="dateCreated" datetime="2025">2025</time> ·
            <span itemprop="artMedium">석고, 동물 뿔</span> · 40 × 20 × 40 cm
          </p>
          <span hidden itemprop="creator" itemscope itemtype="https://schema.org/Person">
            <meta itemprop="name" content="박상규" />
          </span>
        </header>
        <figure class="work-view">
          <img
            src="/img/self-portrait/view2-960.webp"
            srcset="
              /img/self-portrait/view2-480.webp   480w,
              /img/self-portrait/view2-960.webp   960w,
              /img/self-portrait/view2-1200.webp 1200w,
              /img/self-portrait/view2-1600.webp 1600w
            "
            sizes="(min-width: 480px) 440px, calc(100vw - 40px)"
            width="960"
            height="1281"
            alt="뒤에서 본 흉상. 뿔 사이, 뒤통수에 검은 게임 컨트롤러가 박혀 있다."
            loading="lazy"
            decoding="async"
          />
          <figcaption>뒷면</figcaption>
        </figure>
        <figure class="work-view">
          <img
            src="/img/self-portrait/view3-960.webp"
            srcset="
              /img/self-portrait/view3-480.webp   480w,
              /img/self-portrait/view3-960.webp   960w,
              /img/self-portrait/view3-1200.webp 1200w,
              /img/self-portrait/view3-1600.webp 1600w
            "
            sizes="(min-width: 480px) 440px, calc(100vw - 40px)"
            width="960"
            height="1282"
            alt="측면. 뿔 하나, 귀 뒤의 컨트롤러, 어깨 위의 천사상."
            loading="lazy"
            decoding="async"
          />
          <figcaption>측면</figcaption>
        </figure>
        <figure class="work-view">
          <img
            src="/img/self-portrait/view4-960.webp"
            srcset="
              /img/self-portrait/view4-480.webp   480w,
              /img/self-portrait/view4-960.webp   960w,
              /img/self-portrait/view4-1200.webp 1200w,
              /img/self-portrait/view4-1600.webp 1600w
            "
            sizes="(min-width: 480px) 440px, calc(100vw - 40px)"
            width="960"
            height="1280"
            alt="반대쪽 측면."
            loading="lazy"
            decoding="async"
          />
          <figcaption>측면</figcaption>
        </figure>
      </article>
    </main>

    <nav class="work-nav" aria-label="작품 탐색">
