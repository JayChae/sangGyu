            개별 존재들이 하나의 군집으로 결합된 상태에 대한 형상화. 각
            존재들이 독자적으로 움직이며, 일부는 바깥을 향하고 일부는 내부에
            묻힌다. 뒤엉킨 몸은 서로를 지탱하며 탈중앙화된 하나의 생태를
            이룬다. 어느 존재도 구조로부터 완전히 분리되어 있지도, 그것을
            온전히 통제하지도 못한다.
