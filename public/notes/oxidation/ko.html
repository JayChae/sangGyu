        <p>
          녹은 금속의 부식과 파괴이지만, 여기서는 작품 표면을 만들어내는 사건이다.<br />
          생장과 파괴의 이항대립에서 주변화된 파괴는 생장의 반대가 아니라, 새로운 생장의 가능성과 같다.<br />
          파괴는 생장을 다채롭게 만들 뿐만 아니라, 생장의 개념을 정의하는 내부의 부정성이다.
        </p>
