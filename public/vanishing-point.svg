<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" preserveAspectRatio="none">
<!-- The artist's drawing for the landing (geometric_tunnel_atmospheric_exact.svg,
     2026-11-08), changed in four ways only: coordinates rounded to two
     decimals; preserveAspectRatio=none, so it fills any screen corner to
     corner with the vanishing point at the centre; strokes drawn in
     screen pixels (non-scaling-stroke) at half the file's width, the
     weight they have on a 1920-wide screen, so stretching cannot thicken
     one axis' lines and thin the other's; and its last layer, the
     atmosphere (a radial haze, lightest at the vanishing point), is
     painted by the page instead (site.css, "landing"), so the frames can
     be drawn in under the air rather than through it. What every frame
     shares (its colour, no fill) is set once, on their group: it draws
     the same. -->
