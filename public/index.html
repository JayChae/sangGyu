    <link rel="stylesheet" href="/css/site.css" />
    <!-- the one animated crossing, landing → works: both ends must opt in,
         which is what keeps every other navigation a plain cut (site.css).
         Coming back the other way is a cut too: a document styles only the
         crossings that *end* in it, so cancelling them here leaves landing →
         works alone and lets the name play its own arrival, undisturbed. -->
    <style>
      @view-transition { navigation: auto; }
      /* Nothing glides *into* this page — see the comment above. `!important`
         so it outranks site.css's named rules, whatever a snapshot is called.
         Cancelled is not enough on its own: the transition still paints one
         frame, and that frame must not carry the page you came from, or the
         name blinks before its own arrival starts. */
      ::view-transition-group(*),
      ::view-transition-new(*) { animation: none !important; }
      ::view-transition-old(*) { display: none !important; }
    </style>
  </head>
